# 最小单镜像示例：不启动任何数据库容器，SQLite 数据落在命名卷。
services:
  flashtrip:
    image: ghcr.io/sunny-335/flashtrip:latest
    # 本地构建时改为：build: { context: ., args: {} }
    container_name: flashtrip
    # 容器内默认监听 8000。只换对外端口：改为 "6781:8000"；
    # 容器内也要改：加 environment 的 FLASHTRIP_PORT: 6781 并用 "6781:6781"。
    ports:
      - "8000:8000"
    volumes:
      - flashtrip-data:/data
    environment:
      TZ: Asia/Shanghai
      FLASHTRIP_LOG_LEVEL: INFO
      # FLASHTRIP_SECRET_KEY: "请备份；留空则由安装向导生成"
    restart: unless-stopped

volumes:
  flashtrip-data:
