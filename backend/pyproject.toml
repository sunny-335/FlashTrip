[project]
name = "flashtrip-backend"
version = "0.1.0"
description = "FlashTrip — AI-driven lightweight travel planner (FastAPI backend)"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<7",
  "PyJWT>=2.8,<3",
  "argon2-cffi>=23.1,<25",
  "cryptography>=43,<46",
  "httpx>=0.27,<1",
  "openai>=1.40,<3",
  "python-multipart>=0.0.9,<1",
  "structlog>=24,<26",
  "reportlab>=4.2,<5",
  "icalendar>=6,<7",
  "greenlet>=3.0,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
flashtrip = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
